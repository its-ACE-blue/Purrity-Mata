\frac{1}{9}\\).", "en": "Favourable pairs: (3,6), (4,5), (5,4), (6,3). Thus \\(P=\\frac{4}{36}=\\frac{1}{9}\\)."}, "year": 2023, "task": "3", "kind": "past", "source": "https://matemaatika.eu/wp-content/uploads/2024/02/2023.-a-matemaatika-eksamitest.pdf", "confidence": "topic", "tags": ["probability"]}, {"difficulty": "medium", "q": {"et": "2021. a laia eksami ülesanne 1.5 kuulus tõenäosusteooria valdkonda. Harjutus: kaardi valitakse juhuslikult arvudest 1…20. Leia tõenäosus, et arv jagub 3 või 5-ga.", "en": "The 2021 broad exam task 1.5 belonged to probability theory. Practice: choose a number uniformly from 1…20. Find the probability it is divisible by 3 or 5."}, "a": {"et": "3 kordseid on 6, 5 kordseid 4, mõlemat 1. \\(P=\\frac{6+4-1}{20}=\\frac{9}{20}\\).", "en": "There are 6 multiples of 3, 4 multiples of 5, and 1 overlap. \\(P=\\frac{6+4-1}{20}=\\frac{9}{20}\\)."}, "year": 2021, "task": "1.5", "kind": "past", "source": "https://harno.ee/sites/default/files/documents/2021-11/G%C3%BCmnaasiumi%20matemaatika%20laia%20kursuse%20riigieksamite%20v%C3%B5rdlev%20anal%C3%BC%C3%BCs%20(aastad%202019,%202020%20ja%202021).pdf", "confidence": "topic", "tags": ["probability"]}], "plane": [{"difficulty": "medium", "q": {"et": "2024. aasta laia eksami järel kirjeldati I osa kolmnurgaülesannet. Harjutus: kolmnurga kaks külge on 7 cm ja 10 cm ning nende vaheline nurk 60°. Leia kolmanda külje pikkus.", "en": "After the 2024 broad exam, students described a triangle problem in Part I. Practice: two sides of a triangle are 7 cm and 10 cm with included angle 60°. Find the third side."}, "a": {"et": "Koosinusteoreem: \\(c^2=7^2+10^2-2\\cdot7\\cdot10\\cos60^\\circ=79\\), seega \\(c=\\sqrt{79}\\approx8.89\\).", "en": "Cosine rule: \\(c^2=7^2+10^2-2\\cdot7\\cdot10\\cos60^\\circ=79\\), so \\(c=\\sqrt{79}\\approx8.89\\)."}, "year": 2024, "task": null, "kind": "past", "source": "https://www.youtube.com/watch?v=kopiftfbPzU", "confidence": "community", "tags": ["plane"]}, {"difficulty": "medium", "q": {"et": "2023. a laia eksami 7. ülesanne oli planimeetria. Harjutus: täisnurkse kolmnurga kaatetid on 9 cm ja 12 cm. Leia hüpotenuus ja pindala.", "en": "The 2023 broad exam task 7 was plane geometry. Practice: a right triangle has legs 9 cm and 12 cm. Find the hypotenuse and area."}, "a": {"et": "\\(c=\\sqrt{9^2+12^2}=15\\) cm; \\(S=\\frac{9\\cdot12}{2}=54\\text{ cm}^2\\).", "en": "\\(c=\\sqrt{9^2+12^2}=15\\) cm; \\(S=\\frac{9\\cdot12}{2}=54\\text{ cm}^2\\)."}, "year": 2023, "task": "7", "kind": "past", "source": "https://matemaatika.eu/wp-content/uploads/2024/02/2023.-a-matemaatika-eksamitest.pdf", "confidence": "topic", "tags": ["plane"]}, {"difficulty": "hard", "q": {"et": "2021. a laia eksamil esines tasandigeomeetria nii ülesandes 1.2 kui ka 2.4. Harjutus: ringjoone raadius on 6 cm ja kesknurk 120°. Leia sektori pindala.", "en": "In the 2021 broad exam, plane geometry appeared in tasks 1.2 and 2.4. Practice: a circle has radius 6 cm and central angle 120°. Find the sector area."}, "a": {"et": "\\(S=\\frac{120^\\circ}{360^\\circ}\\pi 6^2=12\\pi\\text{ cm}^2\\).", "en": "\\(S=\\frac{120^\\circ}{360^\\circ}\\pi 6^2=12\\pi\\text{ cm}^2\\)."}, "year": 2021, "task": "1.2 / 2.4", "kind": "past", "source": "https://harno.ee/sites/default/files/documents/2021-11/G%C3%BCmnaasiumi%20matemaatika%20laia%20kursuse%20riigieksamite%20v%C3%B5rdlev%20anal%C3%BC%C3%BCs%20(aastad%202019,%202020%20ja%202021).pdf", "confidence": "topic", "tags": ["plane"]}], "stereo": [{"difficulty": "hard", "q": {"et": "2025. a laia matemaatika riigieksami 10. ülesandes tuli leida püramiidi põhja pindala ja ruumala. Harjutus: korrapärase ruutpüramiidi põhja külg on 6 cm ja kõrgus 8 cm. Leia ruumala.", "en": "The 2025 broad-math state exam task 10 involved finding a pyramid base area and volume. Practice: a regular square pyramid has base side 6 cm and height 8 cm. Find its volume."}, "a": {"et": "\\(S_p=6^2=36\\), seega \\(V=\\frac13\\cdot36\\cdot8=96\\text{ cm}^3\\).", "en": "\\(S_p=6^2=36\\), so \\(V=\\frac13\\cdot36\\cdot8=96\\text{ cm}^3\\)."}, "year": 2025, "task": "10", "kind": "past", "source": "https://www.youtube.com/watch?v=JP5FlVzJH4Q", "confidence": "topic", "tags": ["pyramid"]}, {"difficulty": "hard", "q": {"et": "2024. aasta laia eksami järel mainiti püramiidiülesannet. Harjutus: ruutpüramiidi põhja külg on 8 cm ja kõrgus 9 cm. Leia ruumala.", "en": "After the 2024 broad exam, students reported a pyramid problem. Practice: a square pyramid has base side 8 cm and height 9 cm. Find the volume."}, "a": {"et": "\\(V=\\frac13\\cdot8^2\\cdot9=192\\text{ cm}^3\\).", "en": "\\(V=\\frac13\\cdot8^2\\cdot9=192\\text{ cm}^3\\)."}, "year": 2024, "task": null, "kind": "past", "source": "https://www.youtube.com/watch?v=feeNn5NOHkc", "confidence": "community", "tags": ["pyramid"]}, {"difficulty": "medium", "q": {"et": "2023. a laia eksami 10. ülesanne oli püramiid. Harjutus: püramiidi põhja pindala on 45 cm² ja kõrgus 12 cm. Leia ruumala.", "en": "The 2023 broad exam task 10 was a pyramid problem. Practice: a pyramid has base area 45 cm² and height 12 cm. Find its volume."}, "a": {"et": "\\(V=\\frac13\\cdot45\\cdot12=180\\text{ cm}^3\\).", "en": "\\(V=\\frac13\\cdot45\\cdot12=180\\text{ cm}^3\\)."}, "year": 2023, "task": "10", "kind": "past", "source": "https://matemaatika.eu/wp-content/uploads/2024/02/2023.-a-matemaatika-eksamitest.pdf", "confidence": "topic", "tags": ["pyramid"]}, {"difficulty": "hard", "q": {"et": "2021. a laia eksami ülesanne 2.5 oli ruumigeomeetria. Harjutus: silindri raadius on 4 cm ja kõrgus 10 cm. Leia ruumala ja täispindala.", "en": "The 2021 broad exam task 2.5 was solid geometry. Practice: a cylinder has radius 4 cm and height 10 cm. Find volume and total surface area."}, "a": {"et": "\\(V=\\pi r^2h=160\\pi\\text{ cm}^3\\); \\(S=2\\pi r^2+2\\pi rh=112\\pi\\text{ cm}^2\\).", "en": "\\(V=\\pi r^2h=160\\pi\\text{ cm}^3\\); \\(S=2\\pi r^2+2\\pi rh=112\\pi\\text{ cm}^2\\)."}, "year": 2021, "task": "2.5", "kind": "past", "source": "https://harno.ee/sites/default/files/documents/2021-11/G%C3%BCmnaasiumi%20matemaatika%20laia%20kursuse%20riigieksamite%20v%C3%B5rdlev%20anal%C3%BC%C3%BCs%20(aastad%202019,%202020%20ja%202021).pdf", "confidence": "topic", "tags": ["cylinder"]}], "analytic": [{"difficulty": "hard", "q": {"et": "2025. a laia matemaatika riigieksami 5. ülesanne kasutas sirgeid ja vektoreid. Harjutus: punktid A(1,2) ja B(7,5) määravad sirge. Leia vektor AB ja sirge tõus.", "en": "The 2025 broad-math state exam task 5 used lines and vectors. Practice: points A(1,2) and B(7,5) determine a line. Find vector AB and the slope."}, "a": {"et": "\\(\\vec{AB}=(6,3)\\) ja \\(m=\\frac{5-2}{7-1}=\\frac12\\).", "en": "\\(\\vec{AB}=(6,3)\\) and \\(m=\\frac{5-2}{7-1}=\\frac12\\)."}, "year": 2025, "task": "5", "kind": "past", "source": "https://www.youtube.com/watch?v=K6FAM9ISYwE", "confidence": "topic", "tags": ["vectors", "lines"]}, {"difficulty": "hard", "q": {"et": "2023. a laia eksami 12. ülesanne oli analüütiline geomeetria. Harjutus: leia sirge võrrand, mis läbib punkte A(2, −1) ja B(6, 7).", "en": "The 2023 broad exam task 12 was analytical geometry. Practice: find the equation of the line through A(2, −1) and B(6, 7)."}, "a": {"et": "\\(m=\\frac{7-(-1)}{6-2}=2\\). Seega \\(y+1=2(x-2)\\Rightarrow y=2x-5\\).", "en": "\\(m=\\frac{7-(-1)}{6-2}=2\\). Thus \\(y+1=2(x-2)\\Rightarrow y=2x-5\\)."}, "year": 2023, "task": "12", "kind": "past", "source": "https://matemaatika.eu/wp-content/uploads/2024/02/2023.-a-matemaatika-eksamitest.pdf", "confidence": "topic", "tags": ["lines"]}, {"difficulty": "hard", "q": {"et": "2022. a laia eksami 8. ülesande analüüsis käsitleti vektoreid ja ringjoone võrrandit. Harjutus: leia vektor AB, kui A(−3,2) ja B(5,−4), ning selle pikkus.", "en": "The analysis of the 2022 broad exam task 8 mentions vectors and the equation of a circle. Practice: find vector AB for A(−3,2), B(5,−4), and its length."}, "a": {"et": "\\(\\vec{AB}=(8,-6)\\), \\(|\\vec{AB}|=\\sqrt{8^2+(-6)^2}=10\\).", "en": "\\(\\vec{AB}=(8,-6)\\), \\(|\\vec{AB}|=\\sqrt{8^2+(-6)^2}=10\\)."}, "year": 2022, "task": "8", "kind": "past", "source": "https://matemaatika.eu/wp-content/uploads/2023/01/Infopaev-2023-jaan62-Read-Only.pdf", "confidence": "topic", "tags": ["vectors"]}, {"difficulty": "hard", "q": {"et": "2021. a laia eksami ülesanne 2.2 oli analüütiline geomeetria. Harjutus: leia sirge \\(3x-2y+8=0\\) tõus ja y-telje lõikepunkt.", "en": "The 2021 broad exam task 2.2 was analytical geometry. Practice: find the slope and y-intercept of \\(3x-2y+8=0\\)."}, "a": {"et": "\\(y=\\frac32x+4\\), seega tõus \\(m=\\frac32\\) ja lõikepunkt \\((0,4)\\).", "en": "\\(y=\\frac32x+4\\), so slope \\(m=\\frac32\\) and intercept \\((0,4)\\)."}, "year": 2021, "task": "2.2", "kind": "past", "source": "https://harno.ee/sites/default/files/documents/2021-11/G%C3%BCmnaasiumi%20matemaatika%20laia%20kursuse%20riigieksamite%20v%C3%B5rdlev%20anal%C3%BC%C3%BCs%20(aastad%202019,%202020%20ja%202021).pdf", "confidence": "topic", "tags": ["lines"]}], "integrals": [{"difficulty": "hard", "q": {"et": "2025. a laia matemaatika riigieksami 8. ülesanne käsitles puutujat, integraali ja kõvertrapetsi pindala. Harjutus: leia funktsiooni \\(y=2x\\) ja x-telje vaheline pindala vahemikus [0,3].", "en": "The 2025 broad-math state exam task 8 covered a tangent, an integral and the area of a curvilinear trapezoid. Practice: find the area between \\(y=2x\\) and the x-axis on [0,3]."}, "a": {"et": "\\(S=\\int_0^3 2x\\,dx=\\left[x^2\\right]_0^3=9\\).", "en": "\\(S=\\int_0^3 2x\\,dx=\\left[x^2\\right]_0^3=9\\)."}, "year": 2025, "task": "8", "kind": "past", "source": "https://www.youtube.com/watch?v=o4-MtDgZe5U", "confidence": "topic", "tags": ["integrals"]}, {"difficulty": "hard", "q": {"et": "2024. aasta laia eksami järel mainiti määratud integraaliga pindala leidmist. Harjutus: leia funktsiooni \\(y=x^2\\) ja x-telje vaheline pindala vahemikus [0,2].", "en": "After the 2024 broad exam, students reported an area-by-d function scoreSearch(row,q){const phrase=foldText(q),tokens=queryTokens(q);if(!tokens.length)return 0;const blob=row.blob;let score=row.weight||0;const titleBlob=expandSearchText(`${row.title.et} ${row.title.en}`);if(blob.includes(phrase))score+=18;if(titleBlob.includes(phrase))score+=20;let hits=0;for(const token of tokens){if(blob.includes(token)){hits++;score+=titleBlob.includes(token)?9:4}}if(hits===tokens.length)score+=14;if(tokens.length>1&&hits<Math.ceil(tokens.length*.6))return 0;return score}

function crumb(parts){crumbs.innerHTML=parts.map((x,i)=>i===parts.length-1?`<span>${esc(x)}</span>`:esc(x)).join(' / ')}
function home(){crumb([ui[lang].home]);content.innerHTML=`<div class="hero"><span class="tag">🐾 PURRITY MATA</span><h2>${ui[lang].hero}</h2><p>${ui[lang].heroP}</p><div class="scope">🔒 <span>${ui[lang].scopeHero}</span></div></div><div class="grid">${Object.entries(DB.modules).map(([k,m])=>`<div class="card module-card" data-go="${k}"><span class="tag">${m.code}</span><h3>${m.icon} ${esc(t(m.title))}</h3><p>${esc(t(m.desc))}</p><div class="count">${Object.keys(m.topics).length} ${ui[lang].openTopics} →</div></div>`).join('')}<div class="card module-card" data-go="archive"><span class="tag lav">2021–2025</span><h3>🗂️ ${ui[lang].pastMap}</h3><p>${ui[lang].pastMapP}</p><div class="count">5 ${lang==='et'?'aastat':'years'} →</div></div></div><div class="card" style="margin-top:20px"><h3>✨ ${ui[lang].mathRendered}</h3><p style="margin-top:8px">${lang==='et'?'Otsi saab nii eesti kui inglise märksõnade järgi, isegi kui hetkel on ekraan teises keeles.':'Search works with both Estonian and English keywords even when the other language is currently displayed.'}</p></div><div class="footer"><span class="pawline">🐾 🐾 🐾</span><br>${ui[lang].footer}</div>`;bindNav();typeset()}
function modulePage(mk){const m=DB.modules[mk];crumb([ui[lang].home,m.code]);content.innerHTML=`<div class="page-head"><div><span class="tag">${m.code}</span><h2>${m.icon} ${esc(t(m.title))}</h2><p>${esc(t(m.desc))}</p></div><button class="back" data-go="">${ui[lang].back}</button></div><div class="topic-list">${Object.entries(m.topics).map(([tk,tp])=>`<div class="card topic"><div class="topic-icon">${tp.icon}</div><div><h3>${esc(t(tp.title))}</h3><p>${esc(t(tp.desc))}</p><div class="topic-actions"><button class="mini" data-go="${mk}/${tk}/formulas">📘 ${ui[lang].formulas}</button><button class="mini" data-go="${mk}/${tk}/questions">✏️ ${ui[lang].questions}</button></div></div></div>`).join('')}</div>`;bindNav();typeset()}
function topicPage(mk,tk){const m=DB.modules[mk],tp=m.topics[tk];crumb([ui[lang].home,m.code,t(tp.title)]);content.innerHTML=`<div class="page-head"><div><span class="tag">${m.code}</span><h2>${tp.icon} ${esc(t(tp.title))}</h2><p>${esc(t(tp.desc))}</p></div><button class="back" data-go="${mk}">${ui[lang].back}</button></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card module-card" data-go="${mk}/${tk}/formulas"><span class="tag">${ui[lang].formulas.toUpperCase()}</span><h3>📘 ${ui[lang].formulaBook}</h3><p>${ui[lang].formulaBookP}</p></div><div class="card module-card" data-go="${mk}/${tk}/questions"><span class="tag blue">${ui[lang].questions.toUpperCase()}</span><h3>✏️ ${ui[lang].qBank}</h3><p>${ui[lang].qBankP}</p></div></div>`;bindNav();typeset()}
function formulasPage(mk,tk,focus){const m=DB.modules[mk],tp=m.topics[tk];crumb([ui[lang].home,m.code,t(tp.title),ui[lang].formulas]);content.innerHTML=`<div class="page-head"><div><span class="tag">${ui[lang].formulas.toUpperCase()}</span><h2>${tp.icon} ${esc(t(tp.title))}</h2><p>${ui[lang].formulaBookP}</p></div><button class="back" data-go="${mk}/${tk}">${ui[lang].back}</button></div>`+tp.formulas.map((x,i)=>`<article id="formula-${i}" class="formula-card ${String(focus)===String(i)?'search-focus':''}"><div class="formula-top"><div class="formula-title">${i+1}. ${esc(t(x.name))}</div><div class="formula">\\[${x.tex}\\]</div><div class="formula-note">${t(x.note)}</div>${x.vars?`<div class="legend"><h5>${lang==='et'?'Mida tähed tähendavad':'What the letters mean'}</h5><ul>${x.vars.map(v=>`<li><span class="sym">\\(${v.s}\\)</span><span>${esc(v[lang])}</span></li>`).join('')}</ul></div>`:''}</div><div class="examples"><div class="example"><h4>${ui[lang].direct}</h4><p>${t(x.e1.q)}</p><div class="solution"><b>${ui[lang].solution}</b> ${t(x.e1.a)}</div></div><div class="example"><h4>${ui[lang].applied}</h4><p>${t(x.e2.q)}</p><div class="solution"><b>${ui[lang].solution}</b> ${t(x.e2.a)}</div></div></div></article>`).join('');bindNav();typeset();if(focus!==undefined){setTimeout(()=>document.getElementById(`formula-${focus}`)?.scrollIntoView({behavior:'smooth',block:'center'}),100)}}
function qCard(q,i,id){const isPast=q.kind==='past';const diff=ui[lang][q.difficulty]||q.difficulty;const src=q.source?`<span class="src"><a href="${q.source}" target="_blank" rel="noopener">${ui[lang].source} ↗</a></span>`:'';const conf=q.confidence==='community'?`<span class="badge community">${ui[lang].community}</span>`:'';return `<div class="question ${isPast?'past':''}" data-qid="${id}"><div class="q-meta"><span class="difficulty ${q.difficulty}">${diff.toUpperCase()}</span>${isPast?`<span class="badge past">${ui[lang].past}</span>`:''}${q.year?`<span class="year">RE ${q.year}${q.task?' · '+(lang==='et'?'ül ':'task ')+q.task:''}</span>`:''}${conf}${src}</div><p><b>${isPast?'↳':'Q'+(i+1)+'.'}</b> ${t(q.q)}</p><button class="reveal">${ui[lang].reveal}</button><div class="answer">${t(q.a)}</div></div>`}
function questionsPage(mk,tk,filter='all'){const m=DB.modules[mk],tp=m.topics[tk],pastQs=pastFor(tp),practice=(tp.questions||[]).filter(q=>filter==='all'||q.difficulty===filter);crumb([ui[lang].home,m.code,t(tp.title),ui[lang].questions]);content.innerHTML=`<div class="page-head"><div><span class="tag blue">${ui[lang].questions.toUpperCase()}</span><h2>${tp.icon} ${esc(t(tp.title))}</h2><p>${ui[lang].qBankP}</p></div><button class="back" data-go="${mk}/${tk}">${ui[lang].back}</button></div><div class="notice purple">${ui[lang].qIntro}</div><div class="notice">${ui[lang].copyNote}</div><h3 class="section-title">🗂️ ${ui[lang].pastMap}</h3>${pastQs.length?pastQs.map((q,i)=>qCard(q,i,'past-'+i)).join(''):`<div class="empty">${ui[lang].noPast}</div>`}<h3 class="section-title">✏️ ${ui[lang].practice}</h3><div class="q-toolbar">${['all','easy','medium','hard'].map(f=>`<button class="filter ${f===filter?'active':''}" data-filter="${f}">${ui[lang][f]}</button>`).join('')}</div>${practice.length?practice.map((q,i)=>qCard(q,i,'practice-'+tp.questions.indexOf(q))).join(''):`<div class="empty">🐾</div>`}`;document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?ui[lang].hide:ui[lang].reveal});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>questionsPage(mk,tk,b.dataset.filter));bindNav();typeset()}
function archivePage(){crumb([ui[lang].home,ui[lang].archive]);content.innerHTML=`<div class="page-head"><div><span class="tag lav">2021–2025</span><h2>🗂️ ${ui[lang].archive}</h2><p>${ui[lang].pastMapP}</p></div><button class="back" data-go="">${ui[lang].back}</button></div><div class="notice purple">${ui[lang].archiveNote}</div>${DB.archive.map(a=>`<div class="card archive-year"><div class="archive-top"><div><span class="tag ${a.year===2023?'mint':'lav'}">${a.year}</span><h3>${t(a.title)}</h3><p>${t(a.status)}</p></div></div><div class="archive-items">${a.items.map(x=>`<span class="archive-chip">${t(x)}</span>`).join('')}</div><p class="archive-note">${t(a.note)}</p><a class="source-link" href="${a.source}" target="_blank" rel="noopener">${ui[lang].sources}</a>${a.source2?` · <a class="source-link" href="${a.source2}" target="_blank" rel="noopener">${ui[lang].sources} 2</a>`:''}</div>`).join('')}<div class="notice">${lang==='et'?'HARNO märgib, et eksamiülesanded on autoriõigusega kaitstud; õppimiseks võib neid kasutada, kuid see prototüüp ei kopeeri tervete tööde sõnastust.':'HARNO notes that exam tasks are copyright-protected and may be used for study; this prototype therefore does not reproduce whole papers verbatim.'}</div>`;bindNav();typeset()}
function render(){refreshStatic();buildTree(search.value);const p=routeParts();highlight();if(!p.length)return home();if(p[0]==='archive')return archivePage();const [mk,tk,page,focus]=p;if(!DB.modules[mk])return home();if(!tk)return modulePage(mk);if(!DB.modules[mk].topics[tk])return modulePage(mk);if(page==='formulas')return formulasPage(mk,tk,focus);if(page==='questions'){questionsPage(mk,tk);return focusQuestion(focus,p[4])}return topicPage(mk,tk)}
search.addEventListener('input',handleSearch);search.addEventListener('focus',()=>{if(search.value.trim())renderSearchResults(search.value)});search.addEventListener('keydown',e=>{const rows=[...document.querySelectorAll('.search-result')];if(e.key==='Enter'&&rows.length){e.preventDefault();rows[0].click()}if(e.key==='Escape'){searchResults.classList.remove('show');search.blur()}});searchClear.onclick=()=>{search.value='';handleSearch();search.focus()};document.addEventListener('click',e=>{if(!document.getElementById('searchWrap').contains(e.target))searchResults.classList.remove('show')});window.addEventListener('hashchange',render);document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('langToggle').onclick=()=>{lang=lang==='et'?'en':'et';try{localStorage.setItem('pm_lang',lang)}catch(e){}render();if(search.value.trim())renderSearchResults(search.value)};plotPawGraph();refreshStatic();buildTree();render();
</script>
</body>
</html>
